name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CI: "1"
  NODE_VERSION: 24.22.1

jobs:
  gate:
    permissions:
      contents: read
    uses: Manomenu/suwgate/.github/workflows/gate.yml@7c8432804c9be044a08fe2228b9532b7f82dcb38
    with:
      working-directory: Myapp.Web
      dotnet: true
      oasdiff: true
      command: docker compose --profile db up -d --wait db && Myapp.Web/node_modules/.bin/suwgate check --verbose

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: myapp
          POSTGRES_PASSWORD: myapp
          POSTGRES_DB: myapp
        ports:
          - 5533:5432
        options: >-
          --health-cmd "pg_isready -U myapp -d myapp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: actions/setup-dotnet v6.0.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies and the browser
        run: |
          corepack enable
          cd Myapp.Web
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: bash scripts/.internal/e2e.sh
      - name: Keep the traces and screenshots (actions/upload-artifact v7.0.2)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-report
          path: .artifacts/e2e
          if-no-files-found: ignore

  build:
    needs: [gate, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install suwgate for its smoke test
        run: corepack enable && cd Myapp.Web && pnpm install --frozen-lockfile
      - name: Build both images, start the stack and smoke-test it (nothing is published, the registry is project-specific)
        run: |
          docker compose --profile db up -d --build --wait
          Myapp.Web/node_modules/.bin/suwgate dev smoke
      - name: Logs on failure
        if: failure()
        run: docker compose --profile db logs
      - name: Stop the stack
        if: always()
        run: docker compose --profile db down --remove-orphans --volumes
