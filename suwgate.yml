profiles: [web, dotnet, database]
directories:
  web: Myapp.Web
steps:
  skip:
    - step: e2e
      reason: the browser tests need an empty database of their own first, which scripts/.internal/e2e.sh creates; they run there after a change a user clicks, and as their own job in CI
exceptions:
  - guard: architecture/every-project-guarded
    target: Myapp.Gate
    reason: the gate is the test project of the architecture guards, named without .Tests so that it reads as the gate; it has no layers of its own
  - guard: comments-eslint
    target: Myapp.Web/src/api/openapi.d.ts
    reason: generated by openapi-typescript (just api-types), whose doc comments eslint would refuse; the api-contract step checks it equals what the server generates
settings:
  docs-paths:
    ignore: [Myapp.Web/node_modules/, NNNN_snake_case.sql]
  hooks:
    protected: [Myapp.Gate/**]
    generated:
      - path: "**/openapi.d.ts"
        command: just api-types
      - path: "**/contract/openapi.json"
        command: just api-types
dev:
  name: myapp
  ports:
    server: 6300
    web: 3300
    e2eServer: 6301
    e2eWeb: 3301
    database: 5533
    stack: 8190
  server:
    project: Myapp.Server
